apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopease
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: shopease
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
